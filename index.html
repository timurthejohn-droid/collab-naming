<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#fff;color:#0d0d0f;font-family:'Arsenal','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
body::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(560px 420px at 12% 8%,#ffd9bf 0%,transparent 62%),radial-gradient(480px 380px at 90% 88%,#fff2e9 0%,transparent 60%);opacity:.8}
.card{position:relative;width:100%;max-width:420px;background:#fff;border:1px solid #e6e6e8;border-radius:22px;padding:44px 40px 36px;box-shadow:0 30px 70px rgba(13,13,15,.10);text-align:center}
.mark{font-family:'Oswald','Arial Narrow',sans-serif;font-weight:700;letter-spacing:.02em;font-size:15px;line-height:1.15;text-transform:uppercase;margin-bottom:22px}
.mark span{display:block;color:#76767d;font-weight:500;font-size:10.5px;letter-spacing:.16em;margin-top:3px}
.eyebrow{font-family:'Oswald','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.12em;font-size:12px;color:#ff5e1a;font-weight:600;margin-bottom:10px}
h1{font-family:'Oswald','Arial Narrow',sans-serif;text-transform:uppercase;font-weight:600;font-size:23px;letter-spacing:.01em;margin-bottom:10px}
.sub{font-size:14.5px;color:#76767d;margin-bottom:26px;line-height:1.5}
form{display:flex;flex-direction:column;gap:12px}
input{width:100%;border:1.5px solid #e6e6e8;border-radius:12px;padding:14px 16px;font-family:inherit;font-size:16px;color:#0d0d0f;background:#f5f5f6;text-align:center;letter-spacing:.04em;transition:.2s}
input:focus{outline:none;border-color:#ff5e1a;background:#fff}
button{border:none;border-radius:12px;padding:14px 16px;font-family:'Oswald','Arial Narrow',sans-serif;text-transform:uppercase;font-weight:600;font-size:14px;letter-spacing:.06em;color:#fff;cursor:pointer;background:linear-gradient(100deg,#ff5e1a,#ff8a3d);transition:.2s}
button:hover:not(:disabled){filter:brightness(1.05)}
button:disabled{opacity:.6;cursor:progress}
button:focus-visible{outline:2px solid #0d0d0f;outline-offset:2px}
.msg{font-size:13.5px;margin-top:14px;min-height:18px;color:#76767d}
.msg.err{color:#e04a0c}
.shake{animation:sh .34s}
@keyframes sh{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>

<script>
(function(){
  var ITER=200000, KEY='collab_naming_k';
  var f=document.getElementById('f'), pw=document.getElementById('pw'), go=document.getElementById('go'),
      m=document.getElementById('m'), card=document.getElementById('card');
  if(!window.crypto||!crypto.subtle){
    m.className='msg err'; m.textContent='Браузер не поддерживает расшифровку. Откройте ссылку в Safari, Chrome или Firefox.';
    go.disabled=true; return;
  }
  var raw=Uint8Array.from(atob(document.getElementById('p').textContent.trim()),function(c){return c.charCodeAt(0)});
  var salt=raw.subarray(0,16), iv=raw.subarray(16,28), tag=raw.subarray(28,44), ct=raw.subarray(44);
  var data=new Uint8Array(ct.length+tag.length); data.set(ct); data.set(tag,ct.length);
  function open_(pass){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey'])
      .then(function(km){return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt'])})
      .then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,data)})
      .then(function(buf){
        var html=new TextDecoder('utf-8').decode(buf);
        try{sessionStorage.setItem(KEY,pass)}catch(e){}
        document.open(); document.write(html); document.close();
      });
  }
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var pass=pw.value.trim().toLowerCase();
    if(!pass){pw.focus();return}
    go.disabled=true; m.className='msg'; m.textContent='Расшифровываем…';
    setTimeout(function(){
      open_(pass)['catch'](function(){
        go.disabled=false; m.className='msg err'; m.textContent='Неверный пароль. Проверьте раскладку и попробуйте ещё раз.';
        card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); pw.select();
      });
    },30);
  });
  try{
    var saved=sessionStorage.getItem(KEY);
    if(saved){m.textContent='Открываем…'; go.disabled=true;
      open_(saved)['catch'](function(){sessionStorage.removeItem(KEY); go.disabled=false; m.textContent=''})}
  }catch(e){}
})();
